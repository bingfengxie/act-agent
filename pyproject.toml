[project]
name = "act-agent"
version = "0.1.0"
description = "Standalone multi-tenant activity management agent built on LangGraph + MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "mcp>=1.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.48",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/act_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 提示词与摘要模板是自然语言长句，不按代码行长切分
"src/act_agent/graph/prompts.py" = ["E501"]
"src/act_agent/graph/compress.py" = ["E501"]
