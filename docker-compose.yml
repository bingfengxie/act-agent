services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: act
      POSTGRES_PASSWORD: act
      POSTGRES_DB: act_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U act -d act_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build: .
    ports:
      - "8088:8088"
    environment:
      ACT_AGENT_DATABASE_URL: postgresql+asyncpg://act:act@postgres:5432/act_agent
      ACT_AGENT_CHECKPOINT_DSN: postgresql://act:act@postgres:5432/act_agent
      ACT_AGENT_LOCK_BACKEND: pg
      ACT_AGENT_SKILLS_DIR: /app/act-skills
      ACT_AGENT_MCP_CONFIG_PATH: /app/config/mcp.json
      ACT_AGENT_LLM_PROVIDER: ${ACT_AGENT_LLM_PROVIDER:-openai}
      ACT_AGENT_LLM_MODEL: ${ACT_AGENT_LLM_MODEL:-deepseek-flash}
      ACT_AGENT_LLM_BASE_URL: ${ACT_AGENT_LLM_BASE_URL:-https://api.deepseek.com}
      ACT_AGENT_LLM_API_KEY: ${ACT_AGENT_LLM_API_KEY:-}
      ACT_AGENT_JWT_SECRET: ${ACT_AGENT_JWT_SECRET:-change-me}
    volumes:
      - ../act-skills:/app/act-skills:ro
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
